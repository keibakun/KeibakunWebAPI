name: 【本番】出馬表取得
run-name: 【本番】出馬表取得
on:
  schedule:
    # JST 20:00 は UTC 11:00 のため、金曜〜月曜を UTC11:00 に設定
    - cron: '3 10 * * 5' # 金
    - cron: '3 10 * * 6' # 土
    - cron: '3 10 * * 0' # 日
    - cron: '3 10 * * 1' # 月
  workflow_dispatch: {}

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Run production shutuba (use run-time year-month-day)
        env:
          KEIBAKUN_SERVER_URL: ${{ secrets.KEIBAKUN_SERVER_URL }}
        run: |
          npm install
          # compute JST year, month, day
          YYYY=$(TZ=Asia/Tokyo date +%Y)
          MM=$(TZ=Asia/Tokyo date +%m)
          DD=$(TZ=Asia/Tokyo date +%d)
          echo "Run for yyyymmdd: ${YYYY}${MM}${DD} (JST)"
          # randomize start time within the hour: sleep 0..119 seconds
          SLEEP=$((RANDOM % 120))
          echo "Random sleep for ${SLEEP} seconds to randomize start time within the hour"
          sleep ${SLEEP}
          npx tsx ./src/NKScraper/main_shutuba.ts ${YYYY} ${MM} ${DD}
