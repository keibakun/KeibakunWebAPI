name: 【手動】レースリスト取得
on:
  workflow_dispatch:
    inputs:
      year:
        description: "取得対象の年を入力"
        required: true
        default: "2025"
      month:
        description: "取得対象の月を入力"
        required: true
        default: "5"

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: scrape netkeiba_raceList
        env:
          KEIBAKUN_SERVER_URL: ${{ secrets.KEIBAKUN_SERVER_URL }}
        run: |
          npm install
          npx tsx ./src/NKScraper/main_raceList.ts ${{ github.event.inputs.year }} ${{ github.event.inputs.month }}

  report:
    needs: [scrape]
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/actions-report.yml
    with:
      workflow-name: '【手動】レースリスト取得'
      conclusion: ${{ needs.scrape.result }}