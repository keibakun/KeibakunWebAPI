name: '【本番】JRAニュース取得'

on:
  schedule:
    - cron: '3 0-9 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run JRA News scraper
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          KEIBAKUN_SERVER_URL: ${{ secrets.KEIBAKUN_SERVER_URL }}
        run: npx tsx src/scripts/jra/MainJraNews.ts