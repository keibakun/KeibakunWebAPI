name: 【手動】レース開催日程取得

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (YYYY)'
        required: true
        default: '2026'

jobs:
  scrape:
    name: scrape
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: scrape netkeiba_raceSchedule
        env:
          KEIBAKUN_SERVER_URL: ${{ secrets.KEIBAKUN_SERVER_URL }}
        run: |
          npm install
          npx tsx ./src/scripts/race/MainRaceSchedule.ts ${{ github.event.inputs.year }}